<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&family=Satisfy&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
180deg,
#ff9ed0,
#ff6fb5,
#b84cff,
#4d007d
);

}

.card{

width:850px;
max-width:92%;

padding:50px;

text-align:center;

border-radius:35px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(10px);

box-shadow:
0 0 30px rgba(255,255,255,.25),
0 0 80px rgba(255,105,180,.45);

}

.title{

font-family:'Great Vibes',cursive;

font-size:80px;

color:white;

text-shadow:
0 0 15px #ff4fa3,
0 0 35px white;

}

.name{

margin-top:20px;

font-size:46px;

font-family:'Poppins',sans-serif;

font-weight:700;

letter-spacing:3px;

text-transform:capitalize;

color:#fff8c9;

text-shadow:
0 0 10px rgba(255,255,255,.8),
0 0 20px #ffb6d9;

}

.cake{

font-size:170px;

margin-top:25px;

animation:bounce 2s infinite;

}

@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-20px);

}

}

.message{

margin-top:30px;

font-size:24px;

line-height:42px;

color:white;

}

.btn{

display:inline-block;

margin-top:40px;

padding:18px 45px;

border-radius:50px;

background:#ff3f92;

color:white;

text-decoration:none;

font-size:22px;

font-weight:bold;

transition:.4s;

}

.btn:hover{

background:#ff1f7a;

transform:scale(1.05);

}

.balloon{

position:absolute;

bottom:-120px;

font-size:55px;

animation:float 12s linear infinite;

}

.b1{left:5%;}
.b2{left:20%;animation-delay:2s;}
.b3{left:40%;animation-delay:4s;}
.b4{left:65%;animation-delay:1s;}
.b5{left:85%;animation-delay:3s;}

@keyframes float{

0%{

transform:translateY(0);

opacity:0;

}

10%{

opacity:1;

}

100%{

transform:translateY(-130vh);

opacity:0;

}

}

</style>

</head>

<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div>
<div class="balloon b4">🎈</div>
<div class="balloon b5">🎈</div>

<div class="card">

<div class="title">
🎉 Happy Birthday 🎉
</div>

<div class="name">
{{ name }} ❤️
</div>

<div class="cake">
🎂
</div>

<div class="message">

Wishing you endless happiness,<br>
good health, lots of success,<br>
beautiful memories and a wonderful year ahead. 💖<br><br>

May all your dreams come true.<br>

You deserve all the happiness in the world. 🌸

</div>

<a
class="btn"
href="{{ url_for('surprise', token=token) }}"
>

🎁 Open Final Surprise

</a>

</div>

</body>

</html>
