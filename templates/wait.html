<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Please Wait 💌</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:
linear-gradient(
180deg,
#12001f,
#2b0055,
#6c00b5,
#ff5fae
);

}

.card{

width:700px;
max-width:92%;

padding:60px;

text-align:center;

border-radius:35px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(12px);

box-shadow:
0 0 35px rgba(255,255,255,.2),
0 0 80px rgba(255,79,163,.45);

}

.title{

font-family:'Great Vibes',cursive;

font-size:72px;

color:#ffe4f5;

text-shadow:
0 0 10px #ff4fa3,
0 0 30px #ff4fa3;

}

.subtitle{

margin-top:25px;

font-size:24px;

line-height:42px;

color:white;

}

.mail{

font-size:95px;

margin-top:35px;

animation:bounce 1.5s infinite;

}

@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-20px);

}

}

.loading{

margin-top:35px;

width:100%;

height:12px;

background:rgba(255,255,255,.2);

border-radius:30px;

overflow:hidden;

}

.bar{

height:100%;

width:0%;

background:
linear-gradient(
90deg,
#ff4f8b,
#ffffff,
#ff4f8b
);

animation:load 4s linear forwards;

}

@keyframes load{

from{

width:0%;

}

to{

width:100%;

}

}

.note{

margin-top:40px;

font-size:20px;

color:white;

line-height:36px;

}

.heart{

position:absolute;

bottom:-120px;

font-size:40px;

animation:float 12s linear infinite;

}

.h1{left:5%;}
.h2{left:22%;animation-delay:2s;}
.h3{left:40%;animation-delay:4s;}
.h4{left:65%;animation-delay:1s;}
.h5{left:85%;animation-delay:3s;}

@keyframes float{

0%{

transform:translateY(0) rotate(0deg);

opacity:0;

}

10%{

opacity:1;

}

100%{

transform:translateY(-130vh) rotate(360deg);

opacity:0;

}

}

</style>

</head>

<body>

<div class="heart h1">💖</div>
<div class="heart h2">💕</div>
<div class="heart h3">💗</div>
<div class="heart h4">💘</div>
<div class="heart h5">💝</div>

<div class="card">

<div class="title">

Registration Successful 🎉

</div>

<div class="mail">

📧

</div>

<div class="subtitle">

Please check your Email Inbox 💌

</div>

<div class="loading">

<div class="bar"></div>

</div>

<div class="note">

✨ We've sent your magical birthday journey link.<br><br>

💖 Open your mailbox and click <b>Open Your Surprise</b> to continue.

</div>

</div>

</body>

</html>
