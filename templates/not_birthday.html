<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Not Yet 🎂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:linear-gradient(
to bottom,
#12001f,
#2d0050,
#6b00a8,
#ff5fb2
);

}

.card{

width:700px;
max-width:90%;

padding:50px;

border-radius:35px;

text-align:center;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.2);

backdrop-filter:blur(10px);

box-shadow:
0 0 30px rgba(255,255,255,.2),
0 0 80px rgba(255,79,163,.45);

}

.title{

font-family:'Great Vibes',cursive;

font-size:70px;

color:#ffd6ef;

text-shadow:
0 0 10px #ff4fa3,
0 0 30px #ff4fa3;

margin-bottom:25px;

}

.icon{

font-size:120px;

margin-bottom:20px;

}

.msg{

font-size:24px;

line-height:42px;

color:white;

}

.name{

color:#ffe66d;

font-size:34px;

font-weight:bold;

}

.note{

margin-top:30px;

font-size:20px;

color:#ffd6ef;

}

.btn{

display:inline-block;

margin-top:40px;

padding:18px 45px;

text-decoration:none;

background:#ff4f8b;

color:white;

border-radius:50px;

font-size:22px;

font-weight:bold;

transition:.4s;

}

.btn:hover{

background:#ff2d72;

transform:scale(1.05);

}

.heart{

position:absolute;

bottom:-100px;

font-size:35px;

animation:float 10s linear infinite;

}

.h1{left:5%;}
.h2{left:20%;animation-delay:2s;}
.h3{left:40%;animation-delay:4s;}
.h4{left:65%;animation-delay:1s;}
.h5{left:85%;animation-delay:3s;}

@keyframes float{

from{

transform:translateY(0) rotate(0deg);

}

to{

transform:translateY(-130vh) rotate(360deg);

}

}

</style>

</head>

<body>

<div class="heart h1">💖</div>
<div class="heart h2">💕</div>
<div class="heart h3">💗</div>
<div class="heart h4">💘</div>
<div class="heart h5">💝</div>

<div class="card">

<div class="title">

Oops... Not Yet 🎁

</div>

<div class="icon">

⏳

</div>

<div class="msg">

Hello <span class="name">{{ name }}</span> ❤️

<br><br>

Today is not your birthday yet.

<br><br>

Your special surprise will unlock automatically on your birthday. 🎂

</div>

<div class="note">

✨ Until then, keep smiling and enjoy every moment. ✨

</div>

<a
class="btn"
href="/"
>

🏠 Back to Home

</a>

</div>

</body>

</html>
