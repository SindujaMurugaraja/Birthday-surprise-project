<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
to bottom,
#12001f,
#2d0050,
#6b00a8,
#ff5fb2
);

}

.card{

width:500px;
max-width:90%;

padding:50px;

text-align:center;

border-radius:30px;

background:rgba(255,255,255,.1);

backdrop-filter:blur(10px);

box-shadow:
0 0 30px rgba(255,255,255,.2);

}

.title{

font-family:'Great Vibes',cursive;

font-size:65px;

color:#ffd6ef;

margin-bottom:15px;

}

.subtitle{

color:white;

margin-bottom:30px;

font-size:18px;

}

input{

width:100%;

padding:16px;

margin-top:15px;

border:none;

border-radius:50px;

outline:none;

font-size:17px;

text-align:center;

}

button{

margin-top:25px;

padding:16px 40px;

border:none;

border-radius:50px;

font-size:20px;

font-weight:bold;

cursor:pointer;

color:white;

background:#ff4f8b;

}

button:hover{

background:#ff2d72;

}

</style>

</head>

<body>

<div class="card">

<div class="title">
Login 💖
</div>

<div class="subtitle">
Welcome Back ✨
</div>

<form>

<input
type="email"
placeholder="Enter Email"
required
>

<input
type="password"
placeholder="Enter Password"
required
>

<button type="submit">

Login

</button>

</form>

</div>

</body>

</html>
