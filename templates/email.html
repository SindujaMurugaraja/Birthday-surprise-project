<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enter Your Email 💌</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:
linear-gradient(
180deg,
#12001f,
#2b0055,
#6c00b5,
#ff5fae
);

}

.card{

width:650px;
max-width:90%;

padding:55px;

border-radius:35px;

text-align:center;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(12px);

box-shadow:
0 0 35px rgba(255,255,255,.2),
0 0 70px rgba(255,79,163,.45);

}

.title{

font-family:'Great Vibes',cursive;

font-size:70px;

color:#ffe3f4;

text-shadow:
0 0 10px #ff4fa3,
0 0 30px #ff4fa3;

margin-bottom:20px;

}

.subtitle{

color:white;

font-size:20px;

line-height:35px;

margin-bottom:35px;

}

input{

width:100%;

padding:18px;

border:none;

outline:none;

border-radius:50px;

font-size:18px;

text-align:center;

margin-bottom:30px;

}

button{

padding:18px 45px;

font-size:22px;

font-weight:bold;

border:none;

border-radius:50px;

cursor:pointer;

color:white;

background:
linear-gradient(
45deg,
#ff4f8b,
#ff9fd5
);

transition:.4s;

}

button:hover{

transform:scale(1.08);

box-shadow:
0 0 20px white,
0 0 40px pink;

}

.heart{

position:absolute;

bottom:-120px;

font-size:40px;

animation:float 12s linear infinite;

}

.h1{left:5%;}
.h2{left:20%;animation-delay:2s;}
.h3{left:40%;animation-delay:4s;}
.h4{left:65%;animation-delay:1s;}
.h5{left:85%;animation-delay:3s;}

@keyframes float{

0%{

transform:
translateY(0)
rotate(0deg);

opacity:0;

}

10%{

opacity:1;

}

100%{

transform:
translateY(-130vh)
rotate(360deg);

opacity:0;

}

}

</style>

</head>

<body>

<div class="heart h1">💖</div>
<div class="heart h2">💕</div>
<div class="heart h3">💗</div>
<div class="heart h4">💘</div>
<div class="heart h5">💝</div>

<div class="card">

<div class="title">

Begin Your Journey 💌

</div>

<div class="subtitle">

Enter your Email ID to start your magical birthday journey ✨

</div>

<form action="/details" method="GET">

<input
type="email"
name="email"
placeholder="📧 Enter Your Email ID"
required
>

<button type="submit">

🎁 Continue

</button>

</form>

</div>

</body>

</html>
